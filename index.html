<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misamis Oriental Provincial Road Network</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="image/peo.png">
    <!-- Tailwind CSS CDN for basic styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body class="bg-gray-100">

    <!-- Header -->
    <header class="app-header">
        <div class="flex items-center gap-2">
            <span class="text-2xl"</span>
            <h1 class="text-lg sm:text-xl font-bold tracking-tight">Misamis Oriental Provincial Road Network</h1>
        </div>
        <div class="hidden md:block text-sm font-medium bg-green-900 px-3 py-1 rounded-full">
            Provincial Engineering Office - Misamis Oriental
        </div>
    </header>

    <!-- Map Area -->
    <div class="relative flex-grow flex flex-col overflow-hidden">
        
        <!-- Responsive Base Map Switcher -->
        <div id="controlPanel" class="map-controls-overlay collapsed">
            <div class="toggle-btn text-green-700" onclick="togglePanel()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
            </div>

            <div class="content-wrapper p-4 sm:p-0">
                <div class="flex justify-between items-center mb-3 sm:hidden">
                    <h3 class="text-xs font-bold uppercase tracking-widest text-gray-400">Map Settings</h3>
                    <button onclick="togglePanel()" class="text-gray-400">✕</button>
                </div>

                <h3 class="hidden sm:block text-xs font-bold uppercase tracking-widest text-gray-400 mb-3">Layer Gallery</h3>
                
                <div class="flex flex-col gap-2 mb-4">
                    <label class="flex items-center text-sm font-medium text-gray-700 cursor-pointer group">
                        <input type="radio" name="basemap" value="osm" checked class="w-4 h-4 mr-3 accent-green-600">
                        <span class="group-hover:text-green-700 transition-colors">Street Map</span>
                    </label>
                    <label class="flex items-center text-sm font-medium text-gray-700 cursor-pointer group">
                        <input type="radio" name="basemap" value="satellite" class="w-4 h-4 mr-3 accent-green-600">
                        <span class="group-hover:text-green-700 transition-colors">Satellite View</span>
                    </label>
                </div>

                <hr class="border-gray-200 mb-3">

                <h3 class="text-xs font-bold uppercase tracking-widest text-gray-400 mb-3">Feature Layers</h3>
                <div class="flex flex-col gap-2">
                    <div class="flex items-center justify-between text-sm font-medium text-gray-700">
                        <span>Provincial Roads</span>
                        <button class="legend-eye-btn" data-layer="provincialRoads" onclick="toggleLayerVisibility(event)" style="background: none; border: none; cursor: pointer; padding: 0; color: #15803d; font-size: 16px; display: flex; align-items: center;">
                            <svg class="eye-visible" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            <svg class="eye-hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                        </button>
                    </div>
                    <div class="flex items-center justify-between text-sm font-medium text-gray-700">
                        <span>Provincial Bridges</span>
                        <button class="legend-eye-btn" data-layer="provincialBridges" onclick="toggleLayerVisibility(event)" style="background: none; border: none; cursor: pointer; padding: 0; color: #0891b2; font-size: 16px; display: flex; align-items: center;">
                            <svg class="eye-visible" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            <svg class="eye-hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                        </button>
                    </div>
                </div>

                <hr class="border-gray-200 mb-3">
                
                <h3 class="text-xs font-bold uppercase tracking-widest text-gray-400 mb-3">Filters</h3>
                <div class="flex flex-col gap-2">
                    <label class="flex items-center text-sm font-medium text-gray-700 cursor-pointer group">
                        <input type="checkbox" id="coreRoadsToggle" class="w-4 h-4 mr-3 accent-green-600">
                        <span class="group-hover:text-green-700 transition-colors">Show Core Roads only</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- The Map Container -->
        <div id="map"></div>

        <!-- Search Feature -->
        <div class="search-container">
            <div class="search-input-wrapper">
                <span class="search-icon">🔍</span>
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Search road or enter coordinates (8.5, 124.5)..."
                    autocomplete="off"
                >
                <button class="search-clear-btn" id="searchClearBtn" onclick="clearSearch()">✕</button>
            </div>
            <div class="search-suggestions" id="searchSuggestions"></div>
        </div>

        <!-- Right-Click Context Menu -->
        <div id="mapContextMenu" class="context-menu" style="display: none; position: fixed;">
            <div class="context-menu-coords">
                Coordinates
                <div class="context-menu-coords-text" id="coordsDisplay"></div>
            </div>
            <button class="context-menu-item" onclick="copyMapCoordinates()">
                📋 Copy Coordinates
            </button>
            <button class="context-menu-item" onclick="openMapInGoogleMaps()">
                🗺️ Open in Google Maps
            </button>
            <hr class="context-menu-divider">
            <button class="context-menu-item" onclick="copyDDMCoordinates()">
                📌 Copy as DDM
            </button>
            <button class="context-menu-item" onclick="copyDMSCoordinates()">
                📌 Copy as DMS
            </button>
        </div>
    </div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <script src="script.js"></script>
</body>
